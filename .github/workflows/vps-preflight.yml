name: VPS Preflight

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vps-preflight.yml'
      - 'deploy/**'
      - 'Dockerfile'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect VPS prerequisites without changing the host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -eu
            printf 'Connected user: '
            id -un

            printf 'Docker: '
            command -v docker
            docker ps --format '  {{.Names}} {{.Ports}}'

            printf 'Nginx: '
            command -v nginx
            sudo -n nginx -t

            printf 'Nginx configuration owning GreenKube hostnames:\n'
            sudo -n nginx -T 2>&1 | awk '
              /^# configuration file / { config = $0 }
              /server_name[[:space:]].*greenkube\.cloud/ {
                print config
                print
              }
              /proxy_pass[[:space:]]+http:\/\/127\.0\.0\.1:300[0-9]+/ {
                print config
                print
              }
            '

            printf 'Listening web and site ports:\n'
            sudo -n ss -ltn | awk 'NR == 1 || /:(80|443|3002|3003)([[:space:]]|$)/'

            if command -v certbot >/dev/null 2>&1; then
              printf 'Certbot: '
              certbot --version
              sudo -n certbot certificates 2>/dev/null |
                grep -E 'Certificate Name:|Domains:' || true
            else
              printf 'Certbot: not installed\n'
            fi
