server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name greenkube.cloud;

    ssl_certificate /etc/letsencrypt/live/greenkube.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greenkube.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/greenkube-site/current;

    location = / {
        return 308 /en/$is_args$args;
    }

    include /etc/nginx/snippets/greenkube-legacy-redirects.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.greenkube.cloud;

    ssl_certificate /etc/letsencrypt/live/greenkube.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greenkube.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://greenkube.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.greenkube.cloud;

    ssl_certificate /etc/letsencrypt/live/docs.greenkube.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.greenkube.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
