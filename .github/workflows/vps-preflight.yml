name: VPS Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/vps-preflight.yml'
      - 'deploy/**'
      - 'Dockerfile'
      - 'src/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check organization secret access
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -eu
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USERNAME" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$SSH_PORT" ]; then
            echo "::warning::VPS preflight skipped because one or more organization secrets are not available to this repository."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect VPS prerequisites without changing the host
        if: steps.secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -eu
            printf 'Connected user: '
            id -un

            printf 'Docker: '
            command -v docker
            docker ps --format '  {{.Names}} {{.Ports}}' |
              grep '^greenkube-website ' || printf '  docs container not found\n'

            printf 'Nginx: '
            command -v nginx

            printf 'Nginx configuration files with GreenKube hostnames:\n'
            nginx_image=$(docker inspect --format '{{.Image}}' greenkube-website)
            docker run --rm \
              --entrypoint /bin/sh \
              --mount type=bind,src=/etc/nginx,dst=/host-nginx,readonly \
              "$nginx_image" \
              -c 'grep -R -n "server_name.*greenkube" /host-nginx 2>/dev/null'

            printf 'Listening web and site ports:\n'
            ss -ltn | awk 'NR == 1 || /:(80|443|300[0-9])([[:space:]]|$)/'

            printf 'Curl: '
            command -v curl

            if command -v certbot >/dev/null 2>&1; then
              printf 'Certbot: '
              certbot --version
              if certbot certificates 2>/dev/null | grep -E 'Certificate Name:|Domains:'; then
                :
              else
                printf 'Certificate details require elevated permissions\n'
              fi
            else
              printf 'Certbot: not installed\n'
            fi

            if command -v openssl >/dev/null 2>&1; then
              printf 'Apex TLS certificate:\n'
              openssl x509 \
                -in /etc/letsencrypt/live/greenkube.cloud/fullchain.pem \
                -noout -subject -ext subjectAltName -enddate
            fi
